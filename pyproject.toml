[project]
name = "multimediasorter"
version = "2.1.7"
description = "Automatically sorts media files into clean, human-readable names using TMDb/TVMaze metadata, ready for media servers."
authors = [{name = "xyzjonas"}]
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "PyYAML>=6.0,<7",
    "pydantic>2,<3",
    "aiohttp>=3.8.3,<4",
    "rich>=13.1.0,<16",
    "async-cache>=1.1.1,<3",
    "typer>0.2,<0.28",
    "loguru>=0.7.2,<0.8",
]

[project.scripts]
mediasorter = "mediasorter.cli:main"
multimediasorter = "mediasorter.cli:main"

[project.urls]
Repository = "https://github.com/xyzjonas/mediasorter"

[dependency-groups]
dev = [
    "pytest<10",
    "mock>=5.0.1,<6",
    "tox>=4.61.4",
    "ruff>=0.16.6",
    "pytest-asyncio>1",
    "pytest-xdist>=3.8.0",
]

[tool.uv]
default-groups = "all"

[tool.hatch.build.targets.sdist]
include = ["src/mediasorter"]

[tool.hatch.build.targets.wheel]
include = ["src/mediasorter"]

[tool.hatch.build.targets.wheel.sources]
"src/mediasorter" = "mediasorter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
