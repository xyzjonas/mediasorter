[project]
name = "multimediasorter"
version = "2.0.4"
description = ""
authors = []
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "PyYAML>=6.0,<7",
    "pydantic>=1.10.4,<3",
    "aiohttp>=3.8.3,<4",
    "rich>=13.1.0,<16",
    "async-cache>=1.1.1,<3",
    "typer>=0.12.3,<0.28",
    "loguru>=0.7.2,<0.8",
]

[project.scripts]
mediasorter = "mediasorter.cli:main"

[dependency-groups]
dev = [
    "pytest>=7.2.1,<8",
    "pytest-asyncio>=0.20.3,<0.21",
    "mock>=5.0.1,<6",
    "tox>=4.61.4",
    "ruff>=0.16.6",
]

[tool.uv]
default-groups = "all"

[tool.hatch.build.targets.sdist]
include = ["src/mediasorter"]

[tool.hatch.build.targets.wheel]
include = ["src/mediasorter"]

[tool.hatch.build.targets.wheel.sources]
"src/mediasorter" = "mediasorter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
